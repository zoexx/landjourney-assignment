packages:
  - "apps/*"
  - "packages/*"

# Angular's toolchain needs these to run their install scripts.
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"
  - lmdb
  - msgpackr-extract

# turbo already guarantees install ordering; re-checking before every task
# just makes each one shell out to a second pnpm install.
verifyDepsBeforeRun: false
